<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="40%" stop-color="#E8863A"/>
      <stop offset="100%" stop-color="#D4572A" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8863A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1A0F0A"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="100" height="100" rx="12" fill="#1A0F0A"/>
  <!-- Sun glow -->
  <circle cx="50" cy="38" r="28" fill="#E8863A" opacity="0.15"/>
  <circle cx="50" cy="38" r="18" fill="#E8863A" opacity="0.25"/>
  <!-- Sun -->
  <circle cx="50" cy="38" r="12" fill="url(#sun)"/>
  <!-- Water line -->
  <rect x="0" y="58" width="100" height="42" rx="0" fill="url(#water)"/>
  <!-- Reflection -->
  <ellipse cx="50" cy="72" rx="8" ry="14" fill="#E8863A" opacity="0.2"/>
  <ellipse cx="50" cy="72" rx="4" ry="10" fill="#FFD700" opacity="0.15"/>
  <!-- Horizon -->
  <line x1="0" y1="58" x2="100" y2="58" stroke="#E8863A" stroke-width="0.5" opacity="0.6"/>
</svg>